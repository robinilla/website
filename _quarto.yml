format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
    code-fold: true
    code-summary: "Mostrar código"
    include-after-body: 
    - file: _language-menu.html
    - text: |
        <script>
        (() => {
          function translateNavbar() {
            const htmlLanguage =
              (document.documentElement.lang || "").toLowerCase();

            const pathParts =
              window.location.pathname.toLowerCase().split("/");

            const isEnglish =
              htmlLanguage.startsWith("en") ||
              pathParts.includes("en");

            const labels = isEnglish
              ? {
                  brand: "Sonia Illanas Website",
                  publications: "Publications",
                  phd: "PhD",
                  conferences: "Conferences",
                  teaching: "Teaching",
                  people: "About me",
                  footer: "Built with Quarto"
                }
              : {
                  brand: "Web de Sonia Illanas",
                  publications: "Publicaciones",
                  phd: "Tesis",
                  conferences: "Congresos",
                  teaching: "Recursos",
                  people: "Sobre mí",
                  footer: "Creado con Quarto"
                };

            function pageName(href) {
              return (href || "")
                .split("#")[0]
                .split("?")[0]
                .replace(/\/$/, "")
                .split("/")
                .pop()
                .replace(/\.(html|qmd)$/, "");
            }

            document
              .querySelectorAll("#quarto-header a.nav-link")
              .forEach((link) => {
                const page = pageName(link.getAttribute("href"));

                if (labels[page]) {
                  link.textContent = labels[page];
                }
              });

            const navbarTitle = document.querySelector(
              "#quarto-header .navbar-title"
            );

            if (navbarTitle) {
              navbarTitle.textContent = labels.brand;
            }

            const footerRight = document.querySelector(
              ".nav-footer-right"
            );

            if (footerRight) {
              footerRight.textContent = labels.footer;
            }
          }

          if (document.readyState === "loading") {
            document.addEventListener(
              "DOMContentLoaded",
              translateNavbar
            );
          } else {
            translateNavbar();
          }
        })();
        </script>

babelquarto:
  
  languagelinks: navbar
  languagecodes:
  - name: es
    text: "Español"
  
  - name: en 
    text: "English"

  mainlanguage: es
  languages: 
    - en
